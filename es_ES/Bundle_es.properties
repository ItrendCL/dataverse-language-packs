#harvestclients.xhtml
harvestclients.title=Administrar la recolecci\u00f3n de clientes
harvestclients.toptip=La recolecci\u00f3n pude ser programada para ejecutarse bajo demanda o en un momento determinado. La recolecci\u00f3n se puede iniciar aqu\u00ed o mediante el API REST.
harvestclients.noClients.label=No hay clientes configurados.
harvestclients.noClients.why.header=\u00bfQu\u00e9 se est\u00e1 recolectando?
harvestclients.noClients.why.reason1=Harvesting is a process of exchanging metadata with other repositories. As a harvesting <b><i>client</i></b>, your Dataverse gathers metadata records from remote sources. These can be other Dataverse instances, or other archives that support OAI-PMH, the standard harvesting protocol.
harvestclients.noClients.why.reason2=Harvested metadata records are searchable by users. Clicking on a harvested dataset in the search results takes the user to the original repository. Harvested datasets cannot be edited in your Dataverse installation.
harvestclients.noClients.how.header=Como usar la recolecci\u00f3n
harvestclients.noClients.how.tip1=Para recolectar metadatos, se crea y configura un <i>Recolector cliente</i> para cada repositorio remoto. Tenga en cuenta que al crear un cliente, necesitar\u00e1 seleccionar un dataverse local para albergar los datasets recolectados.
harvestclients.noClients.how.tip2=Los registros recolectados pueden mantenerse sincronizados con el servidor original programando actualizaciones incrementales (diarias o semanales por ejemplo). De forma alternativa, la recolecci\u00f3n se puede realizar bajo demanda desde esta p\u00e1gina o usando el API REST.
harvestclients.noClients.getStarted=Para comenzar, haga click en el bot\u00f3n A\u00f1adir Cliente. Si quiere m\u00e1s informaci\u00f3n sobre como recolectar, revise la secci\u00f3n sobre <a href="{0}/{1}/user/index.html#index" title="Gu\u00eda de usuario de Dataverse - Recolecci\u00f3n" target="_blank">Recolecci\u00f3n</a> de la Gu\u00eda de usuario.

